name: handwriting-studio
services:
  api:
    image: handwriting-studio:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - handwriting-data:/data
    environment:
      DATA_DIR: /data
      MAX_DATA_BYTES: "1073741824"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:8090:8080
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  handwriting-data:
