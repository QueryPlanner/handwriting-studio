[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-studio"
version = "0.1.0"
description = "Turn labeled handwriting photographs into TrueType and web fonts."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=12.1,<14",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<6",
  "fonttools>=4.60,<5",
  "brotli>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "coverage>=7,<8", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["handwriting*"]

[tool.setuptools.package-data]
handwriting = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["handwriting"]
branch = true

[tool.coverage.report]
show_missing = true
