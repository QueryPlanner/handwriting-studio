name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check handwriting tests examples
      - run: ruff format --check handwriting tests examples
      - run: coverage run -m pytest -q
      - run: coverage report -m --fail-under=100
      - run: node --check handwriting/static/studio.js
      - run: node --check handwriting/static/theme.js
      - run: node scripts/build-site.mjs
      - name: Validate the gateway configuration
        run: docker run --rm --add-host api:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.28-alpine nginx -t
